services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime-kuma
    volumes:
      - ./config/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3001:3001
    restart: always
    healthcheck:
      test: ["CMD", "extra/healthcheck"]
      interval: 60s
      timeout: 30s
      start_period: 180s
      retries: 5
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+-slim$ # include labels in the format #.#.#-slim


  nut:
    image: instantlinux/nut-upsd:latest
    container_name: nut
    environment:
      - API_USER=${UPS_USER}
      - API_PASSWORD=${UPS_PASSWORD}
      - DRIVER=${UPS_DRIVER}
      - INSTCMDS=all
      - MAXAGE=25
      - NAME=ups
      - POLLINTERVAL=15
      - PORT=${UPS_USB_DEVICE}
      - SDORDER=0
      - SECRETNAME=${UPS_PASSWORD}
      - SERIAL=${UPS_SERIALNUM}
      - SERVER=primary
      - VENDORID=${UPS_VENDORID}
    devices:
      - ${UPS_USB_DEVICE}
    ports:
      - 3493:3493
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "upsc ups@localhost:3493 ups.status || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+-r\d+$


  whatsupdocker:
    image: getwud/wud:latest
    container_name: whatsupdocker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ
      - WUD_WATCHER_LOCAL_SOCKET=/var/run/docker.sock
      - WUD_WATCHER_REMOTE_HOST=${WUD_REMOTE_HOST}
      - WUD_WATCHER_REMOTE_PORT=2375
      - WUD_REGISTRY_HUB_PUBLIC_LOGIN=${DOCKER_LOGIN}
      - WUD_REGISTRY_HUB_PUBLIC_PASSWORD=${DOCKER_TOKEN}
      - WUD_AUTH_BASIC_CHRIS_USER=${WUD_USERNAME}
      - WUD_AUTH_BASIC_CHRIS_HASH=${WUD_HTPASSWD_HASH}
    restart: always
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    labels:
      - wud.tag.include=^\d+\.\d+\.\d+$


  signal-cli:
    image: bbernhard/signal-cli-rest-api
    container_name: signal-api
    restart: always
    ports:
        - 8080:8080
    volumes:
      - ./config/signal:/home/.local/share/signal-cli
    environment:
        - MODE=native
