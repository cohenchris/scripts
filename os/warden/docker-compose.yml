services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime-kuma
    volumes:
      - ./config:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3001:3001
    restart: always


  nut:
    image: instantlinux/nut-upsd:latest
    container_name: nut
    environment:
      - API_USER=${UPS_USER}
      - API_PASSWORD=${UPS_PASSWORD}
      - DRIVER=${UPS_DRIVER}
      - INSTCMDS=all
      - MAXAGE=25
      - NAME=ups
      - POLLINTERVAL=15
      - PORT=${UPS_USB_DEVICE}
      - SDORDER=0
      - SECRETNAME=${UPS_PASSWORD}
      - SERIAL=${UPS_SERIALNUM}
      - SERVER=primary
      - VENDORID=${UPS_VENDORID}
    devices:
      - ${UPS_USB_DEVICE}
    ports:
      - 3493:3493
    restart: always


  whatsupdocker:
    image: getwud/wud:latest
    container_name: whatsupdocker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ
      - WUD_REGISTRY_HUB_PUBLIC_LOGIN=${DOCKER_LOGIN}
      - WUD_REGISTRY_HUB_PUBLIC_PASSWORD=${DOCKER_TOKEN}
      - WUD_AUTH_BASIC_CHRIS_USER=${WUD_USERNAME}
      - WUD_AUTH_BASIC_CHRIS_HASH=${WUD_HTPASSWD_HASH}
    restart: always
    ports:
      - 3000:3000
