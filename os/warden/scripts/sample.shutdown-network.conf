# Config for shutdown-network.sh - copy to .shutdown-network.conf (same directory
# as the script) and fill it in. This file is sourced as bash.

########## Signal ##########
# Base URL of the signal-cli REST API container the shutdown script sends through.
# NOTE: must be the base URL only (e.g. http://localhost:8080), NOT the full
# http://localhost:8080/v2/send
# Defaults to http://localhost:8080
SIGNAL_API_ENDPOINT=""
# Signal number registered/linked in the signal container, used as the sender
# e.g. +15551234567
SIGNAL_SENDER=""
# Space-separated recipients - phone numbers and/or group IDs
# (group IDs are listed by GET <endpoint>/v1/groups/<SIGNAL_SENDER>, e.g. group.abc123==)
# e.g. "+15557654321 group.abc123=="
SIGNAL_RECIPIENTS=""


########## Shutdown targets ##########
# Machines to shut down over SSH, one "user@host command" entry each. Everything
# up to the first space is the SSH target; the rest is the command run on it.
# They are shut down in the order listed, so anything the others are reached
# through (switch, router) should come last.
# warden must have passwordless root SSH to each one (the script runs as root).
# Do not list warden itself - it is always powered off last.
# e.g.
# SHUTDOWN_CMDS=(
#   "root@server1.lan systemctl poweroff"
#   "root@router.lan poweroff"
# )
SHUTDOWN_CMDS=()
